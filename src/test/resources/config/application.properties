# Test-only overrides. Spring Boot loads classpath:/config/application.properties
# after classpath:/application.properties, so these win in tests.
# OAuth client registration fails on an empty client id, so tests need a placeholder.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
