spring.application.name=travel-risk-platform
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.cache.cache-names=tripAssessments
spring.cache.redis.time-to-live=${REDIS_CACHE_TTL:10m}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/travel-risk;MODE=PostgreSQL}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}


spring.jackson.default-property-inclusion=non_null
travel-risk.user-agent=travel-risk-platform/1.0
travel-risk.openai.api-key=${OPENAI_API_KEY:}
travel-risk.openai.model=${OPENAI_MODEL:gpt-6-astra}
travel-risk.http.connect-timeout-ms=${HTTP_CONNECT_TIMEOUT_MS:1500}
travel-risk.http.read-timeout-ms=${HTTP_READ_TIMEOUT_MS:3000}
travel-risk.monitoring.slow-call-threshold-ms=${SLOW_API_THRESHOLD_MS:1500}
travel-risk.security.username=${TRAVEL_RISK_USERNAME:employee@gmail.com}
travel-risk.security.password=${TRAVEL_RISK_PASSWORD:travel-risk-demo}
travel-risk.jwt.issuer=travel-risk-platform
travel-risk.jwt.secret=${TRAVEL_RISK_JWT_SECRET:change-this-demo-secret-with-32-plus-chars}


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Google OAuth2 setup:
# 1. Create a Google OAuth client for a web application.
# 2. Add this redirect URI in Google Cloud:
#    http://localhost:8080/login/oauth2/code/google
# 3. Keep the real client values in local .env:
#    GOOGLE_CLIENT_ID=your-client-id
#    GOOGLE_CLIENT_SECRET=your-client-secret
