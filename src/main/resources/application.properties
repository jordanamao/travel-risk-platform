spring.application.name=travel-risk-platform
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.cache.cache-names=tripAssessments
spring.cache.redis.time-to-live=${REDIS_CACHE_TTL:10m}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/travel-risk;MODE=PostgreSQL}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}


spring.jackson.default-property-inclusion=non_null
travel-risk.user-agent=travel-risk-platform/1.0
travel-risk.openai.api-key=${OPENAI_API_KEY:}
travel-risk.openai.model=${OPENAI_MODEL:gpt-6-astra}
travel-risk.road511.api-key=${ROAD511_API_KEY:}
travel-risk.http.connect-timeout-ms=${HTTP_CONNECT_TIMEOUT_MS:2000}
travel-risk.http.read-timeout-ms=${HTTP_READ_TIMEOUT_MS:5000}
travel-risk.analyze.source-timeout-ms=${ANALYZE_SOURCE_TIMEOUT_MS:4000}
travel-risk.analyze.ai-timeout-ms=${ANALYZE_AI_TIMEOUT_MS:6000}
travel-risk.policy.location=${TRAVEL_POLICY_LOCATION:classpath:travel-policy.yml}
travel-risk.itinerary-import.max-rows=${ITINERARY_IMPORT_MAX_ROWS:25}
spring.servlet.multipart.max-file-size=256KB
spring.servlet.multipart.max-request-size=256KB
travel-risk.monitoring.slow-call-threshold-ms=${SLOW_API_THRESHOLD_MS:1500}
travel-risk.alerts.webhook-url=${ALERT_WEBHOOK_URL:}
travel-risk.alerts.cooldown=${ALERT_COOLDOWN:15m}
travel-risk.alerts.failure-threshold=${ALERT_FAILURE_THRESHOLD:2}
travel-risk.alerts.slow-source-ms=${ALERT_SLOW_SOURCE_MS:5000}
travel-risk.demo-data.enabled=${DEMO_DATA_ENABLED:false}
travel-risk.demo-admin.username=${DEMO_ADMIN_USERNAME:demo-admin@email.com}
travel-risk.demo-admin.password=${DEMO_ADMIN_PASSWORD:travel-risk-demo}
travel-risk.security.employee-username-pattern=${TRAVEL_RISK_EMPLOYEE_USERNAME_PATTERN:employee[0-9]+@email\\.com}
travel-risk.security.password=${TRAVEL_RISK_PASSWORD:travel-risk-demo}
travel-risk.security.admin-username=${TRAVEL_RISK_ADMIN_USERNAME:}
travel-risk.security.admin-password=${TRAVEL_RISK_ADMIN_PASSWORD:}
travel-risk.jwt.issuer=travel-risk-platform
travel-risk.jwt.secret=${TRAVEL_RISK_JWT_SECRET:change-this-demo-secret-with-32-plus-chars}

travel-risk.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
travel-risk.rate-limit.analyze.requests=${RATE_LIMIT_ANALYZE_REQUESTS:30}
travel-risk.rate-limit.analyze.window=${RATE_LIMIT_ANALYZE_WINDOW:60s}
travel-risk.rate-limit.token.requests=${RATE_LIMIT_TOKEN_REQUESTS:10}
travel-risk.rate-limit.token.window=${RATE_LIMIT_TOKEN_WINDOW:60s}


# Google sign-in is enabled only when GOOGLE_CLIENT_ID is set (see GoogleOAuthConfig).
travel-risk.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
travel-risk.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Google OAuth2 setup:
# 1. Create a Google OAuth client for a web application.
# 2. Add this redirect URI in Google Cloud:
#    http://localhost:8080/login/oauth2/code/google
# 3. Keep the real client values in local .env:
#    GOOGLE_CLIENT_ID=your-client-id
#    GOOGLE_CLIENT_SECRET=your-client-secret
