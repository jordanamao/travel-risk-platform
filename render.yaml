services:
  - type: web
    name: travel-risk-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SPRING_CACHE_TYPE
        value: simple
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: native
      - key: DATABASE_URL
        fromDatabase:
          name: travel-risk-platform-db
          property: connectionString
      - key: JPA_DDL_AUTO
        value: validate
      - key: TRAVEL_RISK_JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: DEMO_DATA_ENABLED
        value: "true"
      - key: ALERT_WEBHOOK_URL
        sync: false

databases:
  - name: travel-risk-platform-db
    plan: free
    databaseName: travelrisk
    user: travelrisk
    postgresMajorVersion: "17"
